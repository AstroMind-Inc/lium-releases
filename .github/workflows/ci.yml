name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n install.sh scripts/test-install.sh
      - name: ShellCheck
        run: shellcheck install.sh scripts/test-install.sh
      - name: Installer security tests
        run: bash scripts/test-install.sh
